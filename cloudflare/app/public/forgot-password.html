<!DOCTYPE html>
<html lang="sv" data-theme="legacy"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#04070e">
<meta name="referrer" content="no-referrer"><title>Glömt lösenord? – Produkter</title>
<link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script><link rel="icon" href="/logo.svg" type="image/svg+xml">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head><body><main id="auth-view"><div class="card auth-card">
<label class="theme-control auth-theme"><span>Tema</span><select data-theme-select aria-label="Tema"><option value="legacy">Legacy</option><option value="forest">Avkroken</option><option value="blackout">Blackout</option></select></label>
<h1>Glömt lösenord?</h1><p>Ange din e-postadress för att få en länk där du väljer ett nytt lösenord.</p>
<form id="forgot-password-form">
<label for="recovery-email">E-postadress</label>
<input id="recovery-email" name="email" type="email" autocomplete="username" maxlength="254" required>
<div id="recovery-turnstile" data-turnstile-widget data-sitekey="" data-action="password_recovery"></div>
<button type="submit">Skicka återställningslänk</button></form>
<p id="recovery-msg" role="status" aria-live="polite"></p>
<p><a href="/">Tillbaka till inloggning</a></p>
</div></main><script src="/password-recovery.js" defer></script></body></html>
