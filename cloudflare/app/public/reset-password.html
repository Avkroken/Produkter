<!DOCTYPE html>
<html lang="sv" data-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer"><title>Välj nytt lösenord – Produkter</title>
<link rel="stylesheet" href="/style.css"><link rel="icon" href="/logo.svg" type="image/svg+xml">
</head><body><main id="auth-view"><div class="card auth-card">
<h1>Välj nytt lösenord</h1><form id="reset-password-form">
<label for="new-password">Nytt lösenord (minst 8 tecken)</label>
<input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
<label for="confirm-password">Upprepa lösenordet</label>
<input id="confirm-password" name="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
<button type="submit">Spara nytt lösenord</button></form>
<p><a href="/forgot-password.html">Begär en ny återställningslänk</a></p>
<p id="recovery-msg" role="status" aria-live="polite"></p>
<p><a href="/">Tillbaka till inloggning</a></p>
</div></main><script src="/password-recovery.js" defer></script></body></html>
