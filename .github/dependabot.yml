version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/scraper", "/scraper/*"]
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/cloudflare/app", "/cloudflare/engine", "/cloudflare/processor"]
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      worker-security-updates:
        applies-to: security-updates
        patterns: ["*"]
      worker-version-updates:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/scraper"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
