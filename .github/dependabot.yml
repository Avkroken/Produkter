version: 2
updates:
  - package-ecosystem: "pip"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:00"
      timezone: "Europe/Stockholm"
    groups:
      pip-patch-minor:
        update-types: ["minor", "patch"]

  # Båda Dockerfilerna: roten och scraperns. Bara "/" innebar att scraperns
  # basimage aldrig bumpades — och det är basimagen nästan alla Trivy-fynd
  # kommer från, så utan den här raden rapporteras fynd som ingen åtgärdar.
  - package-ecosystem: "docker"
    assignees: ["blixten85"]
    directories:
      - "/"
      - "/scraper"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:30"
      timezone: "Europe/Stockholm"

  - package-ecosystem: "github-actions"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "01:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    assignees: ["blixten85"]
    directories:
      - "/"
      - "/scraper"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:10"
      timezone: "Europe/Stockholm"
    groups:
      docker-compose-patch-minor:
        update-types: ["minor", "patch"]

  # Scrapern som flyttade hit. Egen Dockerfile och requirements.txt per
  # deltjänst (api, webui, fetcher, alerts, scraper).
  - package-ecosystem: "pip"
    assignees: ["blixten85"]
    directories:
      - "/scraper"
      - "/scraper/*"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:00"
      timezone: "Europe/Stockholm"
    groups:
      scraper-pip-patch-minor:
        update-types: ["minor", "patch"]

  # Workers-versionen som flyttade hit.
  - package-ecosystem: "npm"
    assignees: ["blixten85"]
    directories:
      - "/cloudflare/app"
      - "/cloudflare/engine"
      - "/cloudflare/processor"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "00:20"
      timezone: "Europe/Stockholm"
    groups:
      npm-patch-minor:
        update-types: ["minor", "patch"]
