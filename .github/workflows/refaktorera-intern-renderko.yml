name: Tillfallig refaktorering av intern renderko

on:
  push:
    branches:
      - work/fix
    paths:
      - .github/workflows/refaktorera-intern-renderko.yml

permissions:
  contents: write

jobs:
  refaktorera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/fix
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Refaktorera interna renderko-anrop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {n}")
              return text.replace(old, new, 1)

          p = Path("cloudflare/engine/src/index.ts")
          s = p.read_text()
          s = once(
              s,
              '  ALERT_COOLDOWN_HOURS?: string; // cooldown per bevakning (default 24)\n}\n\nconst REPO = "Avkroken/produkter";',
              '  ALERT_COOLDOWN_HOURS?: string; // cooldown per bevakning (default 24)\n}\n\nexport interface RenderKoEnv {\n  DB: D1Database;\n}\n\nconst REPO = "Avkroken/produkter";',
              "RenderKoEnv",
          )
          s = once(s, "interface LeasedJob {", "export interface LeasedJob {", "LeasedJob")
          s = once(
              s,
              'async function leaseJobs(req: Request, env: Env): Promise<Response> {\n  const body = (await req.json().catch(() => ({}))) as { n?: number };\n  const n = Math.min(Math.max(1, body.n ?? 10), MAX_LEASE);\n  const now = Date.now();',
              'export async function leasaRenderJobb(env: RenderKoEnv, antal = 10): Promise<LeasedJob[]> {\n  const n = Math.min(Math.max(1, antal), MAX_LEASE);\n  const now = Date.now();',
              "lease helper",
          )
          s = once(s, "  if (rows.length === 0) return json({ jobs: [] });", "  if (rows.length === 0) return [];", "empty lease")
          s = once(
              s,
              '  return json({ jobs });\n}\n\ninterface ResultBody {',
              '  return jobs;\n}\n\nasync function leaseJobs(req: Request, env: Env): Promise<Response> {\n  const body = (await req.json().catch(() => ({}))) as { n?: number };\n  return json({ jobs: await leasaRenderJobb(env, body.n ?? 10) });\n}\n\nexport interface ResultBody {',
              "lease adapter",
          )
          s = once(
              s,
              '  title?: string;\n  price?: number;\n  source_text?: string;\n  category?: string;\n  links?: string[]; // för list-jobb: upptäckta produkt-URL:er (bakåtkompat)\n  items?: { url: string; title?: string; price?: number; category?: string }[]; // list-jobb: strukturerat',
              '  title?: string | null;\n  price?: number | null;\n  source_text?: string;\n  category?: string | null;\n  links?: string[]; // för list-jobb: upptäckta produkt-URL:er (bakåtkompat)\n  items?: { url: string; title?: string | null; price?: number | null; category?: string | null }[]; // list-jobb: strukturerat',
              "nullable result",
          )
          s = once(
              s,
              'async function reportResult(id: number, req: Request, env: Env): Promise<Response> {\n  const body = (await req.json().catch(() => ({}))) as ResultBody;\n  const now = Date.now();',
              'export async function rapporteraRenderResultat(id: number, body: ResultBody, env: RenderKoEnv): Promise<Response> {\n  const now = Date.now();',
              "result helper",
          )
          s = once(
              s,
              '  return json({ ok: true, links: body.links?.length ?? 0, items: body.items?.length ?? 0 });\n}\n\ninterface IngestBody {',
              '  return json({ ok: true, links: body.links?.length ?? 0, items: body.items?.length ?? 0 });\n}\n\nasync function reportResult(id: number, req: Request, env: Env): Promise<Response> {\n  const body = (await req.json().catch(() => ({}))) as ResultBody;\n  return rapporteraRenderResultat(id, body, env);\n}\n\ninterface IngestBody {',
              "result adapter",
          )
          p.write_text(s)

          p = Path("cloudflare/engine/src/webblasare.ts")
          s = p.read_text()
          s = once(
              s,
              'import { launch } from "@cloudflare/playwright";\n',
              'import { launch } from "@cloudflare/playwright";\nimport { leasaRenderJobb, rapporteraRenderResultat } from "./index";\n',
              "browser import",
          )
          s = once(
              s,
              'export interface WebblasareEnv {\n  BROWSER: Fetcher;\n  INGEST_API_KEY: string;\n  BROWSER_MAX_LIST_PAGES?: string;\n}\n\ntype InternFetch = (request: Request) => Promise<Response>;\n',
              'export interface WebblasareEnv {\n  BROWSER: Fetcher;\n  DB: D1Database;\n  BROWSER_MAX_LIST_PAGES?: string;\n}\n',
              "browser env",
          )
          s = once(
              s,
              'function authHeaders(env: WebblasareEnv): HeadersInit {\n  return { "X-API-Key": env.INGEST_API_KEY, "Content-Type": "application/json" };\n}\n\n',
              '',
              "auth headers",
          )
          start = s.index("async function hamtaJobb")
          end = s.index("async function accepteraKakor")
          s = s[:start] + '''async function hamtaJobb(env: WebblasareEnv, antal: number): Promise<RenderJobb[]> {\n  return (await leasaRenderJobb(env, antal)) as RenderJobb[];\n}\n\nasync function rapporteraResultat(env: WebblasareEnv, jobbId: number, resultat: RenderResultat): Promise<void> {\n  const response = await rapporteraRenderResultat(jobbId, resultat, env);\n  if (!response.ok) throw new Error(`Resultatrapportering misslyckades: HTTP ${response.status}`);\n}\n\n''' + s[end:]
          s = once(
              s,
              'export async function bearbetaRenderKo(env: WebblasareEnv, dispatch: InternFetch, limit: number): Promise<number> {\n  if (!env.INGEST_API_KEY) throw new Error("INGEST_API_KEY saknas");\n  const jobb = await hamtaJobb(env, dispatch, limit);',
              'export async function bearbetaRenderKo(env: WebblasareEnv, limit: number): Promise<number> {\n  const jobb = await hamtaJobb(env, limit);',
              "browser entry",
          )
          s = s.replace("rapporteraResultat(env, dispatch, ", "rapporteraResultat(env, ")
          for forbidden in ("dispatch", "INGEST_API_KEY", "InternFetch", "authHeaders"):
              if forbidden in s:
                  raise SystemExit(f"webblasare.ts still contains {forbidden}")
          for required in ("function arPrivatVard", "export function valideraMalUrl"):
              if required not in s:
                  raise SystemExit(f"webblasare.ts lost required guard: {required}")
          p.write_text(s)

          p = Path("cloudflare/engine/src/worker.ts")
          s = p.read_text()
          s = once(
              s,
              '      const renderade = await bearbetaRenderKo(\n        env,\n        (request) => coreHandler.fetch(request, env, ctx),\n        limit,\n      );',
              '      const renderade = await bearbetaRenderKo(env, limit);',
              "worker call",
          )
          p.write_text(s)
          PY

      - name: Installera beroenden
        working-directory: cloudflare/engine
        run: npm ci

      - name: Typkontrollera
        working-directory: cloudflare/engine
        run: npx tsc --noEmit

      - name: Kontrollera diff
        run: |
          git diff --check
          git diff -- cloudflare/engine/src/index.ts cloudflare/engine/src/webblasare.ts cloudflare/engine/src/worker.ts

      - name: Commit runtime-fixen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/engine/src/index.ts cloudflare/engine/src/webblasare.ts cloudflare/engine/src/worker.ts
          git commit -m "fix: koppla Browser Run direkt till renderkon"
          git push origin HEAD:work/fix
