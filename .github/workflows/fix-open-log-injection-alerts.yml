name: One-shot remaining log-injection remediation

on:
  push:
    branches: [fix/open-log-injection-alerts]

permissions: {}

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Create Gamnacken App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Apply fixes and regression coverage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = '''\n\ndef _safe_log_value(value):\n    return str(value).replace("\\r", "\\\\r").replace("\\n", "\\\\n")\n'''

          root = Path('app.py')
          text = root.read_text()
          marker = 'log = logging.getLogger("describer")\n'
          if '_safe_log_value' not in text:
              if marker not in text:
                  raise SystemExit('root logger marker not found')
              text = text.replace(marker, marker + helper, 1)
          old = '    log.exception("Unhandled error handling %s %s", request.method, request.path)'
          new = '    method = _safe_log_value(request.method)\n    path = _safe_log_value(request.path)\n    log.exception("Unhandled error handling %s %s", method, path)'
          if old not in text:
              raise SystemExit('root request log sink not found')
          text = text.replace(old, new, 1)
          old_provider = '        log.exception("Failed to save provider configuration for provider \'%s\'", provider)'
          new_provider = '        log.exception("Failed to save provider configuration")'
          if old_provider not in text:
              raise SystemExit('provider log sink not found')
          text = text.replace(old_provider, new_provider, 1)
          root.write_text(text)

          webui = Path('scraper/webui/app.py')
          text = webui.read_text()
          marker = 'logger = logging.getLogger(__name__)\n'
          if '_safe_log_value' not in text:
              if marker not in text:
                  raise SystemExit('webui logger marker not found')
              text = text.replace(marker, marker + helper, 1)
          old = '    logger.exception("Unhandled error handling %s %s", request.method, request.path)'
          new = '    method = _safe_log_value(request.method)\n    path = _safe_log_value(request.path)\n    logger.exception("Unhandled error handling %s %s", method, path)'
          if old not in text:
              raise SystemExit('webui request log sink not found')
          webui.write_text(text.replace(old, new, 1))

          test = Path('tests/test_log_safety.py')
          test.write_text('''import ast\nfrom pathlib import Path\n\nimport pytest\n\nROOT_APP = Path(__file__).resolve().parents[1] / "app.py"\nWEBUI_APP = Path(__file__).resolve().parents[1] / "scraper" / "webui" / "app.py"\n\n\ndef _load_helper(path):\n    tree = ast.parse(path.read_text(), filename=str(path))\n    helper = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "_safe_log_value")\n    module = ast.Module(body=[helper], type_ignores=[])\n    namespace = {}\n    exec(compile(ast.fix_missing_locations(module), str(path), "exec"), namespace)\n    return namespace["_safe_log_value"]\n\n\n@pytest.mark.parametrize("path", [ROOT_APP, WEBUI_APP])\n@pytest.mark.parametrize(("value", "expected"), [("GET\\nforged", "GET\\\\nforged"), ("/ok\\r\\nforged", "/ok\\\\r\\\\nforged"), ("plain", "plain")])\ndef test_log_sanitizer_escapes_line_breaks(path, value, expected):\n    sanitized = _load_helper(path)(value)\n    assert sanitized == expected\n    assert "\\r" not in sanitized\n    assert "\\n" not in sanitized\n\n\ndef test_request_error_logs_use_sanitized_values():\n    for path, logger in [(ROOT_APP, "log"), (WEBUI_APP, "logger")]:\n        source = path.read_text()\n        assert "method = _safe_log_value(request.method)" in source\n        assert "path = _safe_log_value(request.path)" in source\n        assert f'{logger}.exception("Unhandled error handling %s %s", method, path)' in source\n\n\ndef test_provider_error_log_does_not_include_request_selected_provider():\n    source = ROOT_APP.read_text()\n    assert 'log.exception("Failed to save provider configuration")' in source\n    assert 'Failed to save provider configuration for provider' not in source\n''')
          PY
          python3 -m venv /tmp/remediation-venv
          /tmp/remediation-venv/bin/python -m pip install --quiet pytest
          /tmp/remediation-venv/bin/python -m pytest -q tests/test_log_safety.py

      - name: Commit remediation
        run: |
          set -euo pipefail
          git config user.name 'gamnacken[bot]'
          git config user.email '316993076+gamnacken[bot]@users.noreply.github.com'
          git add app.py scraper/webui/app.py tests/test_log_safety.py
          git diff --cached --check
          git commit -m 'fix(security): sanitize remaining log values'
          git push origin HEAD:fix/open-log-injection-alerts
