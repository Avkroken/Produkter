name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          find . -path './.git' -prune -o -name 'requirements.txt' -not -path './requirements.txt' -print0 | xargs -0 -r -n1 python -m pip install -r
          if [ -f pyproject.toml ]; then python -m pip install -e '.[test]' || python -m pip install -e .; fi
      - run: python -m compileall .
      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pip install pytest && python -m pytest; else echo "No tests directory found"; fi

  docker:
    runs-on: ubuntu-latest
    needs: python
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy-resultat till code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          # load gör imagen tillgänglig i den lokala docker-daemonen så Trivy
          # kan skanna den även på PR:er, där den inte pushas. Enplattformsbygge,
          # så docker-exportern klarar det.
          load: true
          tags: |
            ghcr.io/blixten85/scraper:latest
            ghcr.io/blixten85/scraper:sha-${{ steps.sha.outputs.short }}

      # Dependabot bevakar bas-imagens tagg i Dockerfile, men inget läser
      # OS-paketen INUTI den byggda imagen. Den skanningen låg i build.yml,
      # som togs bort i #174 när Docker skulle bort — men Docker kom tillbaka
      # i #184 och skanningen följde inte med. Sedan dess har imagen pushats
      # oskannad, och GitHub har flaggat "Trivy is reporting warnings" för att
      # verktyget slutat rapportera.
      - name: Trivy — skanna byggd image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/blixten85/scraper:sha-${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-results.sarif
          # Bara sådant som faktiskt går att åtgärda: utan ignore-unfixed blir
          # det ~125 fynd på Debian-paket utan tillgänglig patch, vilket är
          # exakt det brus som fick förra omgången att dismissas i klump.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Utan denna filtreras severity bara i loggen — SARIF:en skulle
          # ändå innehålla allt, och bruset vore tillbaka i code scanning.
          limit-severities-for-sarif: true
          # Rapportera, fäll inte bygget. Höj till 1 när fyndnivån är känd.
          exit-code: '0'

      - name: Ladda upp Trivy-resultat
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image