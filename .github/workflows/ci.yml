name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          find . -path './.git' -prune -o -path './cloudflare' -prune -o -name requirements.txt -print0 \
            | xargs -0 -r -n1 python -m pip install -r
      - name: Test
        run: |
          python -m compileall . -x '^\./cloudflare/'
          python -m pytest
          (cd scraper && python -m pytest)

  workers:
    name: Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloudflare/app/package-lock.json
            cloudflare/engine/package-lock.json
            cloudflare/processor/package-lock.json
      - name: Install, type-check, test, and dry-run
        run: |
          for worker in app engine processor; do
            (
              cd "cloudflare/$worker"
              npm ci
              npx tsc --noEmit
              npx wrangler deploy --dry-run --outdir .wrangler/dry-run
            )
          done
          node cloudflare/scripts/verify-production.test.mjs
          node cloudflare/scripts/d1-session.test.mjs
          node cloudflare/scripts/password-reset.test.mjs
          (cd cloudflare/engine && npx tsx --test ../shared/providers.test.ts)
