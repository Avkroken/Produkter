name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          head-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

  public-template-guard:
    uses: Avkroken/.github/.github/workflows/public-template-guard.yml@main
    with:
      forbidden_fingerprints: |
        e616bcc305314c41224898c8c4e38d84e81e733e2c1281f02c4690376be4e72f
        40feb4f559c7aa93166361e60e04d6a44067f154448bb8fe520243e980c0fb27
        9e60e46830887d37cf41074d0dc4798a9f8776cbecf2742ee6fdcd1be4b32cdf
        61e34e748075a3525d1fcbc2b346044aef4b412f3893af8dc563ac97845c19c1
        2d9837d23e4d5ffa2066fa07d6c4a3f9a913c32c09af74ecf631f99672f31e98
        64aba032e41c85b143c2c7657832cb9d60f4cbb5150da065b2e4f7912f520c44
        47d0a89719d861bcb2b09bd322e8380c9c7bd949c61dd4831e6e61f238c3dc46
        503b8b33f64f19e3096ef956fcae555cba98c2b48f6ad11512e5b2445cf319e6

  node-cloudflare-validation:
    name: Node and Cloudflare validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Generate generic Cloudflare config
        run: node cloudflare/scripts/configure.mjs --example
      - name: Validate Cloudflare app
        working-directory: cloudflare/app
        run: |
          npm ci
          npm test
          npm run typecheck
          node --check public/access-routing.js
          npx wrangler deploy --dry-run
      - name: Validate Cloudflare engine
        working-directory: cloudflare/engine
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run
      - name: Validate Cloudflare processor
        working-directory: cloudflare/processor
        run: |
          npm ci
          npx tsc --noEmit
          npx wrangler deploy --dry-run

  node-cloudflare:
    name: Node and Cloudflare
    if: ${{ always() }}
    needs:
      - public-template-guard
      - node-cloudflare-validation
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required validation results
        env:
          TEMPLATE_GUARD_RESULT: ${{ needs.public-template-guard.result }}
          NODE_CLOUDFLARE_RESULT: ${{ needs.node-cloudflare-validation.result }}
        run: |
          test "$TEMPLATE_GUARD_RESULT" = "success"
          test "$NODE_CLOUDFLARE_RESULT" = "success"

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r scraper/requirements.txt
          python -m pytest tests
          cd scraper
          python -m pytest tests
