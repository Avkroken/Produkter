name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required:
    name: CI / required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            cloudflare/app/package-lock.json
            cloudflare/engine/package-lock.json
            cloudflare/processor/package-lock.json
      - name: Test Python
        run: |
          python -m pip install --upgrade pip
          find . -path './.git' -prune -o -path './cloudflare' -prune -o -name 'requirements.txt' -print0 \
            | xargs -0 -r -n1 python -m pip install -r
          if [ -f pyproject.toml ]; then python -m pip install -e '.[test]' || python -m pip install -e .; fi
          python -m pip install pytest
          python -m compileall . -x '^\./cloudflare/'
          for d in . scraper; do
            if [ -d "$d/tests" ]; then (cd "$d" && python -m pytest); fi
          done
      - name: Test Workers
        run: |
          for worker in app engine processor; do
            (
              cd "cloudflare/$worker"
              npm ci
              npx tsc --noEmit
              npx wrangler deploy --dry-run --outdir .wrangler/dry-run
            )
          done
          node cloudflare/scripts/verify-production.test.mjs
          node cloudflare/scripts/d1-session.test.mjs
