name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.impact.outputs.python }}
      node: ${{ steps.impact.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm språk-/komponentpåverkan
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-impact.sh

  python-tests:
    needs: impact
    if: ${{ needs.impact.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
          cache: pip

      - name: Installera beroenden
        run: |
          python -m pip install --upgrade pip
          find . -path './.git' -prune -o -path './cloudflare' -prune -o \
            -name 'requirements.txt' -print0 | xargs -0 -r -n1 python -m pip install -r
          if [ -f pyproject.toml ]; then python -m pip install -e '.[test]' || python -m pip install -e .; fi

      - name: Kompilera
        run: python -m compileall . -x '^\./cloudflare/'

      - name: Kör tester
        run: |
          python -m pip install pytest
          for d in . scraper; do
            if [ -d "$d/tests" ]; then
              echo "--- $d"
              (cd "$d" && python -m pytest)
            fi
          done

  python:
    name: python
    needs: [impact, python-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Sammanfatta Python-CI
        env:
          IMPACT: ${{ needs.impact.outputs.python }}
          RESULT: ${{ needs.python-tests.result }}
        run: |
          if [ "$IMPACT" != "true" ]; then
            echo "Python är inte påverkad; ingen Python-körning behövdes."
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            echo "Python-kontrollerna lyckades."
            exit 0
          fi
          echo "Python-kontrollerna slutade med: $RESULT"
          exit 1

  node-workers:
    needs: impact
    if: ${{ needs.impact.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [app, engine, processor]
    defaults:
      run:
        working-directory: cloudflare/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Installera beroenden
        run: npm install

      - name: Typkontroll
        run: npx tsc --noEmit

  node:
    name: node
    needs: [impact, node-workers]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Sammanfatta Node-CI
        env:
          IMPACT: ${{ needs.impact.outputs.node }}
          RESULT: ${{ needs.node-workers.result }}
        run: |
          if [ "$IMPACT" != "true" ]; then
            echo "Node är inte påverkad; ingen Node-körning behövdes."
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            echo "Alla Node-kontroller lyckades."
            exit 0
          fi
          echo "Node-kontrollerna slutade med: $RESULT"
          exit 1

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [impact, python, node]
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera required CI
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          NODE_RESULT: ${{ needs.node.result }}
        run: |
          test "$IMPACT_RESULT" = "success"
          test "$PYTHON_RESULT" = "success"
          test "$NODE_RESULT" = "success"
