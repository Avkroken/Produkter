name: One-shot log-injection remediation

on:
  push:
    branches: [work/fix]

permissions: {}

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Create Gamnacken App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/fix
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Apply focused remediation and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('scraper/scraper/scraper.py')
          source = source_path.read_text()

          old = '''app = Flask(__name__)\n\n\n@app.errorhandler(Exception)\ndef handle_unexpected_error(exc):\n    from werkzeug.exceptions import HTTPException\n\n    if isinstance(exc, HTTPException):\n        return exc\n    logger.exception("Unhandled error handling %s %s", request.method, request.path)\n'''
          new = '''app = Flask(__name__)\n\n\ndef _safe_log_value(value):\n    return str(value).replace("\\r", "\\\\r").replace("\\n", "\\\\n")\n\n\n@app.errorhandler(Exception)\ndef handle_unexpected_error(exc):\n    from werkzeug.exceptions import HTTPException\n\n    if isinstance(exc, HTTPException):\n        return exc\n    method = _safe_log_value(request.method)\n    path = _safe_log_value(request.path)\n    logger.exception("Unhandled error handling %s %s", method, path)\n'''
          if old not in source:
              if '_safe_log_value' not in source:
                  raise SystemExit('Expected vulnerable logging block not found')
          else:
              source_path.write_text(source.replace(old, new, 1))

          test_path = Path('scraper/tests/test_scraper_log_safety.py')
          test_path.write_text('''import ast\nfrom pathlib import Path\n\nimport pytest\n\nSOURCE = Path(__file__).resolve().parents[1] / "scraper" / "scraper.py"\n\n\ndef _load_safe_log_value():\n    tree = ast.parse(SOURCE.read_text(), filename=str(SOURCE))\n    helper = next(\n        node for node in tree.body\n        if isinstance(node, ast.FunctionDef) and node.name == "_safe_log_value"\n    )\n    module = ast.Module(body=[helper], type_ignores=[])\n    namespace = {}\n    exec(compile(ast.fix_missing_locations(module), str(SOURCE), "exec"), namespace)\n    return namespace["_safe_log_value"]\n\n\n@pytest.mark.parametrize(\n    ("value", "expected"),\n    [\n        ("GET\\nforged", "GET\\\\nforged"),\n        ("/ok\\r\\nforged", "/ok\\\\r\\\\nforged"),\n        ("plain", "plain"),\n    ],\n)\ndef test_safe_log_value_escapes_line_breaks(value, expected):\n    sanitized = _load_safe_log_value()(value)\n    assert sanitized == expected\n    assert "\\r" not in sanitized\n    assert "\\n" not in sanitized\n\n\ndef test_unexpected_error_handler_logs_sanitized_request_values():\n    source = SOURCE.read_text()\n    assert "method = _safe_log_value(request.method)" in source\n    assert "path = _safe_log_value(request.path)" in source\n    assert 'logger.exception("Unhandled error handling %s %s", method, path)' in source\n''')

          Path('.github/workflows/fix-log-injection.yml').unlink()
          PY

          python -m py_compile scraper/scraper/scraper.py scraper/tests/test_scraper_log_safety.py
          git diff --check

      - name: Commit remediation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "gamnacken[bot]"
          git config user.email "316993076+gamnacken[bot]@users.noreply.github.com"
          git add scraper/scraper/scraper.py scraper/tests/test_scraper_log_safety.py .github/workflows/fix-log-injection.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): sanitize request values before logging"
          git push origin HEAD:work/fix
