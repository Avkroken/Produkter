name: Bot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      # Apptoken, inte github.token. Merges gjorda med GITHUB_TOKEN triggar
      # aldrig push-baserade workflows (ACCESS-STANDARD regel 1) — 29 tysta
      # workflows i 8 repon, och inga releaser sedan 23-27 juli.
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge github_actions updates
        if: |
          steps.metadata.outputs.package-ecosystem == 'github_actions' && (
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major')
        run: |
          for i in 1 2 3 4 5; do
            gh pr merge --auto --delete-branch --squash "$PR_URL" && break
            echo "attempt $i failed, retrying in 60s..."
            sleep 60
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Auto-merge patch and minor updates (other ecosystems)
        if: |
          steps.metadata.outputs.package-ecosystem != 'github_actions' && (
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          for i in 1 2 3 4 5; do
            gh pr merge --auto --delete-branch --squash "$PR_URL" && break
            echo "attempt $i failed, retrying in 60s..."
            sleep 60
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  security-autofix:
    runs-on: ubuntu-latest
    if: contains(github.head_ref, 'alert-autofix')
    steps:
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Enable auto-merge for security fixes
        run: |
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash --delete-branch "$PR_URL" && break
            echo "attempt $i failed, retrying in 60s..."
            sleep 60
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  claude:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'claude/')
    steps:
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Auto-merge Claude AI PRs once checks pass
        run: |
          gh pr ready "$PR_URL" || true
          # Buffer mot en känd race: om CI redan är grön när det här jobbet
          # startar mergar `gh pr merge --auto` direkt, inte "när det blir
          # grönt" — en agent som hinner pusha en uppföljande commit sekunder
          # senare tappar den då tyst. 90s ger tid att hinna färdigt innan
          # merge-försöket görs. Se blixten85/repo-standard#19.
          sleep 90
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash --delete-branch "$PR_URL" && break
            echo "attempt $i failed, retrying in 60s..."
            sleep 60
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  maintainer-fix:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'blixten85' && startsWith(github.head_ref, 'fix/')
    steps:
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Auto-merge trusted fix PRs once checks pass
        run: |
          gh pr ready "$PR_URL" || true
          sleep 90 # se claude-jobbet ovan för varför
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash --delete-branch "$PR_URL" && break
            echo "attempt $i failed, retrying in 60s..."
            sleep 60
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  codex:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'codex/')
    steps:
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Auto-merge Codex AI PRs once checks pass
        run: |
          gh pr ready "$PR_URL" || true
          sleep 90 # se claude-jobbet ovan för varför
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash --delete-branch "$PR_URL" && break
            echo "attempt $i failed, retrying in 60s..."
            sleep 60
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  copilot:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'copilot/')
    steps:
      - name: Prägla apptoken
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Auto-merge Copilot PRs once checks pass
        run: |
          gh pr ready "$PR_URL" || true
          sleep 90 # se claude-jobbet ovan för varför
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash --delete-branch "$PR_URL" && break
            echo "attempt $i failed, retrying in 60s..."
            sleep 60
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

