name: Deploy security alert ingest

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/security-alerts/**'
      - '.github/workflows/deploy-security-alert-ingest.yml'
  repository_dispatch:
    types: [deploy-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-security-alert-ingest
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(cloudflare/security-alerts/|\.github/workflows/deploy-security-alert-ingest\.yml$)'; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: detect
    if: needs.detect.outputs.deploy == 'true'
    environment: produktion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/security-alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUKTER || secrets.PRODUCT_DESCRIBER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
