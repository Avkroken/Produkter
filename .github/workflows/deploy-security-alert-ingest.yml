name: Deploy security alert ingest

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/security-alerts/**'
      - '.github/workflows/deploy-security-alert-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-security-alert-ingest
  cancel-in-progress: false

jobs:
  deploy:
    environment: produktion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/security-alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUKTER || secrets.PRODUCT_DESCRIBER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
