name: Repair xmldom lockfile

on:
  push:
    branches: [ops/repair-xmldom-lock]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/osv-xmldom-0.8.15
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
      - name: Regenerate and verify lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare/processor
          npm install --package-lock-only --ignore-scripts
          node -e "const l=require('./package-lock.json'); if (l.packages['node_modules/@xmldom/xmldom']?.version !== '0.8.15') process.exit(1)"
          npm ci --ignore-scripts
          cd ../..
          git diff --check
          git diff --exit-code -- cloudflare/processor/package.json
          if git diff --quiet -- cloudflare/processor/package-lock.json; then
            echo 'Expected package-lock.json to change' >&2
            exit 1
          fi
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare/processor/package-lock.json
          git diff --cached --name-only | grep -Fxq 'cloudflare/processor/package-lock.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'fix: sync xmldom lockfile'
          git push origin HEAD:fix/osv-xmldom-0.8.15
