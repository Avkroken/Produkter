name: Tillfällig Browser Run-diagnostik
on:
  push:
    branches: [work/fix]
    paths: [.github/workflows/temp-browser-diagnostics.yml]
permissions:
  contents: write
jobs:
  instrumentera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fix
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lägg till diagnostik och utökad observability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cloudflare/engine/src/webblasare.ts')
          s = p.read_text()
          old = '''      const context = await browser.newContext({
        viewport: { width: 1920, height: 1080 },
        locale: "sv-SE",
        timezoneId: "Europe/Stockholm",
        extraHTTPHeaders: { "Accept-Language": "sv-SE,sv;q=0.9,en-US;q=0.8,en;q=0.7" },
      });

      try {
        const resultat = await renderaJobb(context, env, aktuelltJobb, deadline);'''
          new = '''      let context: any = null;
      let steg = "newContext";
      try {
        console.log("browser_run_jobb_start", { jobbId: aktuelltJobb.id, siteId: aktuelltJobb.site_id, typ: aktuelltJobb.type });
        context = await browser.newContext({
          viewport: { width: 1920, height: 1080 },
          locale: "sv-SE",
          timezoneId: "Europe/Stockholm",
          extraHTTPHeaders: { "Accept-Language": "sv-SE,sv;q=0.9,en-US;q=0.8,en;q=0.7" },
        });
        steg = "renderaJobb";
        const resultat = await renderaJobb(context, env, aktuelltJobb, deadline);
        steg = "rapporteraResultat";'''
          if old not in s:
              raise SystemExit('förväntat Browser Run-block saknas')
          s = s.replace(old, new, 1)
          old2 = '''      } catch (err) {
        const message = err instanceof Error ? err.message : String(err);
        console.error("browser_run_jobb_fel", { jobbId: aktuelltJobb.id, siteId: aktuelltJobb.site_id, fel: message });'''
          new2 = '''      } catch (err) {
        const message = err instanceof Error ? err.message : String(err);
        const stack = err instanceof Error ? err.stack : undefined;
        console.error("browser_run_jobb_fel", {
          jobbId: aktuelltJobb.id,
          siteId: aktuelltJobb.site_id,
          typ: aktuelltJobb.type,
          steg,
          fel: message,
          stack,
        });'''
          if old2 not in s:
              raise SystemExit('förväntad felhantering saknas')
          s = s.replace(old2, new2, 1)
          old3 = '''      } finally {
        await context.close();
      }'''
          new3 = '''      } finally {
        if (context) {
          try {
            await context.close();
          } catch (err) {
            console.warn("browser_run_context_close_fel", {
              jobbId: aktuelltJobb.id,
              fel: err instanceof Error ? err.message : String(err),
            });
          }
        }
      }'''
          if old3 not in s:
              raise SystemExit('förväntad context-close saknas')
          p.write_text(s)

          p = Path('cloudflare/engine/wrangler.jsonc')
          s = p.read_text()
          old = '''  "observability": {
    "enabled": true,
    "head_sampling_rate": 1
  },'''
          new = '''  "observability": {
    "enabled": true,
    "logs": {
      "enabled": true,
      "invocation_logs": true,
      "head_sampling_rate": 1,
      "persist": true
    },
    "traces": {
      "enabled": true,
      "head_sampling_rate": 1,
      "persist": true
    }
  },'''
          if old not in s:
              raise SystemExit('förväntad observability-konfiguration saknas')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Typecheck
        working-directory: cloudflare/engine
        run: |
          npm ci
          npx tsc --noEmit
      - name: Kontrollera diff
        run: |
          git diff --check
          grep -q 'browser_run_jobb_start' cloudflare/engine/src/webblasare.ts
          grep -q '"traces"' cloudflare/engine/wrangler.jsonc
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare/engine/src/webblasare.ts cloudflare/engine/wrangler.jsonc
          git commit -m 'fix: utöka Browser Run-diagnostiken'
          git push origin HEAD:work/fix
