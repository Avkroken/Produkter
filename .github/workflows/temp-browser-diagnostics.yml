name: Browserdiagnostik
"on":
  push:
    branches:
      - work/fix
permissions:
  contents: write
jobs:
  instrumentera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fix
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instrumentera Browser Run
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("cloudflare/engine/src/webblasare.ts")
          s = p.read_text()
          old = '''      const context = await browser.newContext({
        viewport: { width: 1920, height: 1080 },
        locale: "sv-SE",
        timezoneId: "Europe/Stockholm",
        extraHTTPHeaders: { "Accept-Language": "sv-SE,sv;q=0.9,en-US;q=0.8,en;q=0.7" },
      });

      try {
        const resultat = await renderaJobb(context, env, aktuelltJobb, deadline);'''
          new = '''      let context: any = null;
      let steg = "newContext";
      try {
        console.log("browser_run_jobb_start", { jobbId: aktuelltJobb.id, siteId: aktuelltJobb.site_id, typ: aktuelltJobb.type });
        context = await browser.newContext({
          viewport: { width: 1920, height: 1080 },
          locale: "sv-SE",
          timezoneId: "Europe/Stockholm",
          extraHTTPHeaders: { "Accept-Language": "sv-SE,sv;q=0.9,en-US;q=0.8,en;q=0.7" },
        });
        steg = "renderaJobb";
        const resultat = await renderaJobb(context, env, aktuelltJobb, deadline);
        steg = "rapporteraResultat";'''
          if old not in s:
              raise SystemExit("Browser Run-blocket hittades inte")
          s = s.replace(old, new, 1)
          old = '''      } catch (err) {
        const message = err instanceof Error ? err.message : String(err);
        console.error("browser_run_jobb_fel", { jobbId: aktuelltJobb.id, siteId: aktuelltJobb.site_id, fel: message });'''
          new = '''      } catch (err) {
        const message = err instanceof Error ? err.message : String(err);
        const stack = err instanceof Error ? err.stack : undefined;
        console.error("browser_run_jobb_fel", { jobbId: aktuelltJobb.id, siteId: aktuelltJobb.site_id, typ: aktuelltJobb.type, steg, fel: message, stack });'''
          if old not in s:
              raise SystemExit("Felblocket hittades inte")
          s = s.replace(old, new, 1)
          old = '''      } finally {
        await context.close();
      }'''
          new = '''      } finally {
        if (context) {
          try { await context.close(); }
          catch (err) { console.warn("browser_run_context_close_fel", { jobbId: aktuelltJobb.id, fel: err instanceof Error ? err.message : String(err) }); }
        }
      }'''
          if old not in s:
              raise SystemExit("Context-close-blocket hittades inte")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verifiera
        working-directory: cloudflare/engine
        run: |
          npm ci
          npx tsc --noEmit
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/engine/src/webblasare.ts
          git commit -m "fix: utöka Browser Run-diagnostiken"
          git push origin HEAD:work/fix
