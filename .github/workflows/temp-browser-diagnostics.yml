name: Browserdiagnostik
"on":
  push:
    branches: ["work/fix"]
permissions:
  contents: write
jobs:
  instrumentera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fix
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Instrumentera
        env:
          SCRIPT_B64: ""
        run: echo "$SCRIPT_B64" | base64 -d | python3
      - name: Verifiera
        working-directory: cloudflare/engine
        run: npm ci && npx tsc --noEmit
      - name: Commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/engine/src/webblasare.ts
          git commit -m "fix: utöka Browser Run-diagnostiken"
          git push origin HEAD:work/fix
