name: Refresh npm lockfiles

on:
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/refresh-npm-lockfiles.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Regenerate npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for dir in app engine processor; do
            (cd "cloudflare/${dir}" && npm install --package-lock-only --ignore-scripts)
          done
      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/app/package-lock.json cloudflare/engine/package-lock.json cloudflare/processor/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already synchronized"
            exit 0
          fi
          git commit -m "fix: refresh npm lockfiles for Sharp"
          git push origin HEAD:dev
