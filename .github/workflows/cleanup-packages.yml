name: Cleanup packages

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [produkter, scraper]
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PACKAGE: ${{ matrix.package }}
        with:
          script: |
            const org = context.repo.owner;
            const versions = await github.paginate(
              github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
              {
                org,
                package_type: 'container',
                package_name: process.env.PACKAGE,
                per_page: 100,
              },
            );

            for (const version of versions) {
              const tags = version.metadata?.container?.tags ?? [];
              if (tags.includes('latest')) continue;

              try {
                await github.rest.packages.deletePackageVersionForOrg({
                  org,
                  package_type: 'container',
                  package_name: process.env.PACKAGE,
                  package_version_id: version.id,
                });
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                const protectedPublicVersion = /5,?000|downloads/i.test(message);

                if (protectedPublicVersion) {
                  core.warning(
                    `Skipping package version ${version.id}: GitHub does not allow deleting this public version (${message})`,
                  );
                  continue;
                }

                if (error?.status === 401 || error?.status === 403) {
                  throw error;
                }

                core.warning(
                  `Failed to delete package version ${version.id}; continuing with remaining versions: ${message}`,
                );
              }
            }
