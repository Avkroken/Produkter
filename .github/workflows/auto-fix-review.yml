name: Auto-fix trusted review feedback

# Reagerar endast på review-feedback från uttryckligen betrodda botkonton.
# Workflowen skriver inte kod eller löser review-trådar; den ber Codex arbeta
# vidare på samma PR-branch. Ordinarie required checks och review-gates gäller.

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: auto-fix-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hämta App-token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GAMNACKEN_ID }}
          private-key: ${{ secrets.GAMNACKEN_PEMKEY }}
          permission-issues: write
      - name: Be Codex åtgärda betrodd review-feedback
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXTRA_TRUSTED_BOTS: ${{ vars.AUTO_FIX_REVIEW_BOTS }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const pr=context.payload.pull_request;
            if(!pr){core.info('Ingen pull request i eventet.');return;}
            if(pr.head.repo?.full_name!==`${owner}/${repo}`){core.info('Fork-PR; hoppar över skrivande automation.');return;}

            const trusted=new Set(['chatgpt-codex-connector[bot]']);
            for(const login of (process.env.EXTRA_TRUSTED_BOTS||'').split(',').map(s=>s.trim()).filter(Boolean)) trusted.add(login);
            const sender=context.payload.sender?.login||'';
            if(!trusted.has(sender)){core.info(`Review från icke-betrodd aktör ${sender}; ingen auto-fix.`);return;}

            let sourceId, sourceUrl, summary;
            if(context.eventName==='pull_request_review_comment'){
              const comment=context.payload.comment;
              sourceId=`comment-${comment.id}`;
              sourceUrl=comment.html_url;
              summary='inline review-kommentaren';
            }else{
              const review=context.payload.review;
              const body=(review.body||'').trim();
              const state=(review.state||'').toLowerCase();
              if(!body&&state!=='changes_requested'){core.info(`Review state=${state} utan feedback; hoppar över.`);return;}
              sourceId=`review-${review.id}`;
              sourceUrl=review.html_url;
              summary='kodreviewn';
            }

            const marker=`<!-- auto-fix-review:${sourceId} -->`;
            const comments=await github.paginate(github.rest.issues.listComments,{owner,repo,issue_number:pr.number,per_page:100});
            if(comments.some(c=>(c.body||'').includes(marker))){core.info(`Auto-fix är redan begärd för ${sourceId}.`);return;}

            const body=[
              marker,
              `@codex address that feedback from ${summary}: ${sourceUrl}`,
              '',
              'Ändra endast PR-grenen. Läs och utvärdera feedbacken innan du ändrar kod. Lös inte review-tråden förrän en relevant fix är pushad och verifierad. Required checks och övriga live-regler avgör när PR:n får mergas.'
            ].join('\n');
            await github.rest.issues.createComment({owner,repo,issue_number:pr.number,body});
            core.info(`Begärde Codex-fix för ${sourceId}.`);
