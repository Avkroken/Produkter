name: Dependency Review

on:
  # Merge-kön skickar merge_group.checks_requested. Utan den här
  # triggern svarar inget jobb och kön fastnar tills timeout.
  merge_group:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Ingen retry. Retryn väntar på snapshots från Dependency Submission
          # API:t, och ingenting i det här repot skickar sådana — beroendegrafen
          # läser manifesten direkt. Väntan kan alltså aldrig ge något, och när
          # pollningen mot api.github.com tog timeout föll hela jobbet på ett
          # problem som inte fanns.
          retry-on-snapshot-warnings: false
