name: Docker

# Bygger imagen, skannar den med Trivy och publicerar först om skanningen
# är ren. Två images sedan scrapern flyttade hit — samma steg, olika context.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Matrisjobb heter "image (scraper)" i checklistan. Den obligatoriska
  # checken heter docker och sätts av aggregatet längst ned — ett namn som
  # inte ändras när en image läggs till eller tas bort.
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: product-describer
            context: .
          - image: scraper
            context: scraper
    permissions:
      contents: read
      packages: write
      security-events: write # Trivy-resultat till code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: |
            ghcr.io/blixten85/${{ matrix.image }}:latest
            ghcr.io/blixten85/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}

      # Bilden byggs lokalt och publiceras först efter godkänd skanning —
      # annars vore grinden verkningslös: den vore redan ute när Trivy fäller.
      - name: Trivy — skanna byggd image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/blixten85/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
          format: sarif
          output: trivy-results.sarif
          # ignore-unfixed är brusfiltret: det som saknar patch faller bort.
          # Det som blir kvar går per definition att åtgärda.
          ignore-unfixed: true
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'

      # always() så fynden når code scanning även när steget ovan fällde bygget.
      # Kategorin måste vara unik per image, annars skriver den ena imagens
      # resultat över den andras i code scanning.
      - name: Ladda upp Trivy-resultat
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.image }}

      - name: Publicera imagen (först efter godkänd skanning)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          docker push ghcr.io/blixten85/${{ matrix.image }}:latest
          docker push ghcr.io/blixten85/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}

  # Enda check som behöver vara required. Matrisjobbens namn ändras när en
  # image läggs till; det här gör det inte.
  docker:
    if: always()
    needs: [image]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "image: ${{ needs.image.result }}"
          case "${{ needs.image.result }}" in
            failure|cancelled) echo "::error::Minst en image misslyckades."; exit 1 ;;
          esac
