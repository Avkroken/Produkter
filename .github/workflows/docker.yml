name: Docker build & Trivy

# Bygger och Trivy-skannar bara de images som faktiskt påverkas av diffen.
# Huvudimagen och scrapern har separata Docker-contexts och stabila
# Code Scanning-kategorier. Aggregatet `docker` behåller ett stabilt required
# checknamn även när ett av image-jobben inte behöver bygga.
#
# VIKTIGT: Protect main kräver Code Scanning-resultat för varje Trivy-
# konfiguration som finns på main. På PR måste därför även en opåverkad image
# rapportera ett TOMT SARIF-resultat för PR-headen; annars väntar rulesetet för
# evigt trots grön CI. Tomt SARIF laddas ALDRIG upp på main, eftersom det då
# skulle kunna stänga verkliga alerts för imagen.
#
# PR-imagejobben checkar uttryckligen ut PR-headen. upload-sarif använder SHA:n
# i checkout-katalogen, och default-checkout av refs/pull/*/merge kan annars
# koppla Trivy-resultatet till en kortlivad test-mergecommit som rulesetet inte
# längre väntar på.
#
# En schemalagd körning bygger båda images på nytt så nya CVE:er upptäcks även
# när repositoryt inte har ändrats.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '40 5 * * 1' # måndagar 05:40 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      docker_app: ${{ steps.impact.outputs.docker_app }}
      docker_scraper: ${{ steps.impact.outputs.docker_scraper }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm Docker-påverkan
        id: impact
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-impact.sh

  produkter-image:
    needs: impact
    if: ${{ needs.impact.outputs.docker_app == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: needs.impact.outputs.docker_app == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        if: needs.impact.outputs.docker_app == 'true'
        env:
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${TARGET_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        if: needs.impact.outputs.docker_app == 'true'
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/blixten85/produkter:latest
            ghcr.io/blixten85/produkter:sha-${{ steps.sha.outputs.short }}

      - name: Trivy
        if: needs.impact.outputs.docker_app == 'true'
        uses: ./.github/actions/trivy
        with:
          image-ref: ghcr.io/blixten85/produkter:sha-${{ steps.sha.outputs.short }}
          category: trivy-product-describer

      - name: Rapportera opåverkad image till Code Scanning
        if: github.event_name == 'pull_request' && needs.impact.outputs.docker_app != 'true'
        run: |
          cat > trivy-empty.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]
          }
          EOF

      - name: Ladda upp tomt Trivy-resultat
        if: github.event_name == 'pull_request' && needs.impact.outputs.docker_app != 'true'
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          sarif_file: trivy-empty.sarif
          category: trivy-product-describer
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Publicera imagen
        if: needs.impact.outputs.docker_app == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        run: |
          docker push ghcr.io/blixten85/produkter:latest
          docker push ghcr.io/blixten85/produkter:sha-${{ steps.sha.outputs.short }}

  scraper-image:
    needs: impact
    if: ${{ needs.impact.outputs.docker_scraper == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: needs.impact.outputs.docker_scraper == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        if: needs.impact.outputs.docker_scraper == 'true'
        env:
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: echo "short=${TARGET_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        if: needs.impact.outputs.docker_scraper == 'true'
        with:
          context: scraper
          push: false
          load: true
          tags: |
            ghcr.io/blixten85/scraper:latest
            ghcr.io/blixten85/scraper:sha-${{ steps.sha.outputs.short }}

      - name: Trivy
        if: needs.impact.outputs.docker_scraper == 'true'
        uses: ./.github/actions/trivy
        with:
          image-ref: ghcr.io/blixten85/scraper:sha-${{ steps.sha.outputs.short }}
          category: trivy-scraper

      - name: Rapportera opåverkad image till Code Scanning
        if: github.event_name == 'pull_request' && needs.impact.outputs.docker_scraper != 'true'
        run: |
          cat > trivy-empty.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]
          }
          EOF

      - name: Ladda upp tomt Trivy-resultat
        if: github.event_name == 'pull_request' && needs.impact.outputs.docker_scraper != 'true'
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          sarif_file: trivy-empty.sarif
          category: trivy-scraper
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Publicera imagen
        if: needs.impact.outputs.docker_scraper == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
        run: |
          docker push ghcr.io/blixten85/scraper:latest
          docker push ghcr.io/blixten85/scraper:sha-${{ steps.sha.outputs.short }}

  docker:
    if: always()
    needs: [impact, produkter-image, scraper-image]
    runs-on: ubuntu-latest
    steps:
      - name: Sammanfatta Docker-CI
        run: |
          echo "impact: ${{ needs.impact.result }}"
          echo "produkter-image: ${{ needs.produkter-image.result }}"
          echo "scraper-image: ${{ needs.scraper-image.result }}"
          for result in \
            "${{ needs.impact.result }}" \
            "${{ needs.produkter-image.result }}" \
            "${{ needs.scraper-image.result }}"; do
            case "$result" in
              failure|cancelled) echo "::error::Docker-verifieringen misslyckades."; exit 1 ;;
            esac
          done
