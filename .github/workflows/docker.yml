name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "40 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      APP_IMAGE: ghcr.io/avkroken/produkter
      SCRAPER_IMAGE: ghcr.io/avkroken/scraper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build images
        run: |
          docker build --pull -t "$APP_IMAGE:$GITHUB_SHA" .
          docker build --pull -t "$SCRAPER_IMAGE:$GITHUB_SHA" scraper
      - name: Report app vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.APP_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-app.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
      - name: Upload app results
        if: always()
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: trivy-app.sarif
          category: trivy-product-describer
      - name: Gate app vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.APP_IMAGE }}:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Report scraper vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCRAPER_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-scraper.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
      - name: Upload scraper results
        if: always()
        uses: github/codeql-action/upload-sarif@486fec2a3ea2626afcd8c7e9208b4f515078dd7e # codeql-bundle-v2.26.4
        with:
          sarif_file: trivy-scraper.sarif
          category: trivy-scraper
      - name: Gate scraper vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.SCRAPER_IMAGE }}:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Publish images
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          docker tag "$APP_IMAGE:$GITHUB_SHA" "$APP_IMAGE:latest"
          docker tag "$SCRAPER_IMAGE:$GITHUB_SHA" "$SCRAPER_IMAGE:latest"
          docker push "$APP_IMAGE:$GITHUB_SHA"
          docker push "$APP_IMAGE:latest"
          docker push "$SCRAPER_IMAGE:$GITHUB_SHA"
          docker push "$SCRAPER_IMAGE:latest"
