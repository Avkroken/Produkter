name: Docker build & Trivy

# Bygg och skanna bara images som påverkas av diffen. Schema/manual kör båda.
# Docker/Trivy är kompletterande verifiering; live-rulesetet kräver `python` och
# `node`, inte ett separat Docker-wrapperjobb.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      docker_app: ${{ steps.impact.outputs.docker_app }}
      docker_scraper: ${{ steps.impact.outputs.docker_scraper }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm Docker-påverkan
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/ci-impact.sh

  produkter-image:
    needs: impact
    if: ${{ needs.impact.outputs.docker_app == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/avkroken/produkter:latest
            ghcr.io/avkroken/produkter:sha-${{ steps.sha.outputs.short }}
      - name: Trivy
        uses: ./.github/actions/trivy
        with:
          image-ref: ghcr.io/avkroken/produkter:sha-${{ steps.sha.outputs.short }}
          category: trivy-product-describer
      - name: Publicera imagen
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        run: |
          docker push ghcr.io/avkroken/produkter:latest
          docker push ghcr.io/avkroken/produkter:sha-${{ steps.sha.outputs.short }}

  scraper-image:
    needs: impact
    if: ${{ needs.impact.outputs.docker_scraper == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: scraper
          push: false
          load: true
          tags: |
            ghcr.io/avkroken/scraper:latest
            ghcr.io/avkroken/scraper:sha-${{ steps.sha.outputs.short }}
      - name: Trivy
        uses: ./.github/actions/trivy
        with:
          image-ref: ghcr.io/avkroken/scraper:sha-${{ steps.sha.outputs.short }}
          category: trivy-scraper
      - name: Publicera imagen
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
        run: |
          docker push ghcr.io/avkroken/scraper:latest
          docker push ghcr.io/avkroken/scraper:sha-${{ steps.sha.outputs.short }}
