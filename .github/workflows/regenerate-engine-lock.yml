name: Regenerera engine-lockfil

on:
  push:
    branches:
      - work/fix
    paths:
      - .github/workflows/regenerate-engine-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/fix
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      - name: Regenerera package-lock
        working-directory: cloudflare/engine
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package-lock
        run: |
          if git diff --quiet -- cloudflare/engine/package-lock.json; then
            echo "Lockfilen var redan synkad."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/engine/package-lock.json
          git commit -m "fix: synka engine-lockfilen"
          git push origin HEAD:work/fix
