name: Deploy free-first cutover once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/deploy-free-first-once.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: produkter-engine-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Produkter engine
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Gate production mutation until this PR is merged
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          merged_at="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" | jq -r '.merged_at // empty')"
          if [[ -z "$merged_at" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "PR is not merged; production mutation is intentionally skipped."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "PR merged at $merged_at; production mutation is authorized."


      - name: Validate production credential
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN_W1 is not available to this repository"
            exit 1
          fi

      - name: Install engine dependencies
        if: steps.gate.outputs.deploy == 'true'
        working-directory: cloudflare/engine
        run: npm ci --no-audit --no-fund

      - name: Verify engine before production mutation
        if: steps.gate.outputs.deploy == 'true'
        working-directory: cloudflare/engine
        run: |
          npm run typecheck
          npx wrangler deploy --dry-run

      - name: Deploy engine
        if: steps.gate.outputs.deploy == 'true'
        working-directory: cloudflare/engine
        run: npm run deploy

      - name: Verify production
        if: steps.gate.outputs.deploy == 'true'
        working-directory: cloudflare/engine
        run: npm run verify:production
