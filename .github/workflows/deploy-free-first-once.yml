name: Deploy free-first cutover once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-free-first-once.yml"
      - ".github/deploy-free-first-once.trigger"

permissions:
  contents: read

concurrency:
  group: produkter-engine-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Produkter engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_W1 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Validate production credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN_W1 is not available to this repository"
            exit 1
          fi

      - name: Install engine dependencies
        working-directory: cloudflare/engine
        run: npm ci --no-audit --no-fund

      - name: Verify engine before production mutation
        working-directory: cloudflare/engine
        run: |
          npm run typecheck
          npx wrangler deploy --dry-run

      - name: Deploy engine
        working-directory: cloudflare/engine
        run: npm run deploy

      - name: Verify production
        working-directory: cloudflare/engine
        run: npm run verify:production
