name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = re.compile(
              r"^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)"
              r"(\((?!\s*\))[^)]+\))?!?: [^\s].*$"
          )

          valid = (
              "feat: add product export",
              "fix(scraper): preserve retry state",
              "perf!: replace public import contract",
              "docs: clarify deployment model",
              "build(deps): update Worker dependency",
              "ci: harden Cloudflare validation",
              "refactor(engine): isolate queue handling",
              "revert: restore previous provider behavior",
          )
          invalid = (
              "Add product export",
              "feature: add product export",
              "feat add product export",
              "feat:",
              "Feat: add product export",
              "feat( ): add product export",
              "feat(): add product export",
          )

          for fixture in valid:
              if not pattern.fullmatch(fixture):
                  print(f"::error::validator rejected valid fixture: {fixture}")
                  sys.exit(1)

          for fixture in invalid:
              if pattern.fullmatch(fixture):
                  print(f"::error::validator accepted invalid fixture: {fixture}")
                  sys.exit(1)

          title = os.environ.get("PR_TITLE", "").strip()
          if pattern.fullmatch(title):
              print(f"PR title follows Conventional Commits: {title}")
              sys.exit(0)

          print("::error title=Invalid PR title::Use Conventional Commits, for example: "
                "feat: add product export, fix(scraper): preserve retries, "
                "or feat!: change the public contract.")
          print(f"Received: {title!r}")
          sys.exit(1)
          PY
