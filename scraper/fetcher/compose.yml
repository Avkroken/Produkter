services:
  produkter-fetcher:
    build:
      context: .
    container_name: produkter-fetcher
    restart: unless-stopped
    init: true
    environment:
      ENGINE_URL: "${ENGINE_URL:-https://motor.denied.se}"
      INGEST_API_KEY: "${INGEST_API_KEY:?INGEST_API_KEY must be set}"
      FETCHER_CONCURRENCY: "${FETCHER_CONCURRENCY:-3}"
      LEASE_BATCH: "${LEASE_BATCH:-10}"
      POLL_IDLE_SEC: "${POLL_IDLE_SEC:-15}"
      RENDER_WAIT_MS: "${RENDER_WAIT_MS:-12000}"
      MAX_LIST_PAGES: "${MAX_LIST_PAGES:-60}"
      HEADLESS: "1"
