services:
  produkter-fetcher:
    image: ${FETCHER_IMAGE:?Set FETCHER_IMAGE to your published GHCR fetcher image}
    pull_policy: always
    container_name: produkter-fetcher
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      ENGINE_URL: ${ENGINE_URL:?Set ENGINE_URL in .env}
      INGEST_API_KEY: ${INGEST_API_KEY:?Set INGEST_API_KEY in .env}
