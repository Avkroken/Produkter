# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

# CodeRabbit reviews are dispatched by Avkroken's label-driven review router.
# Keep local overrides limited to the router contract; organization settings own
# shared review/status behavior.
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 0
    drafts: true
    labels:
      - review:coderabbit
