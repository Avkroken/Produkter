services:
  app:
    image: ghcr.io/avkroken/produkter:latest
    container_name: produkter
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      PROVIDER_CONFIG_MASTER_KEY: ${PROVIDER_CONFIG_MASTER_KEY:?Set PROVIDER_CONFIG_MASTER_KEY in .env}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
      GITHUB_ERROR_REPORT_TOKEN: ${GITHUB_ERROR_REPORT_TOKEN:-}
      GITHUB_ERROR_REPORT_REPOSITORY: ${GITHUB_ERROR_REPORT_REPOSITORY:-}
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
      - config:/app/config

  sync:
    image: ghcr.io/avkroken/produkter:latest
    container_name: produkter-synk
    restart: unless-stopped
    profiles: [sync]
    command: ["python", "main.py", "sync", "--watch"]
    environment:
      PROVIDER_CONFIG_MASTER_KEY: ${PROVIDER_CONFIG_MASTER_KEY:?Set PROVIDER_CONFIG_MASTER_KEY in .env}
      SCRAPER_URL: ${SCRAPER_URL:-http://scraper:8000}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
      SCRAPER_API_KEY_FILE: ${SCRAPER_API_KEY_FILE:-}
      GITHUB_ERROR_REPORT_TOKEN: ${GITHUB_ERROR_REPORT_TOKEN:-}
      GITHUB_ERROR_REPORT_REPOSITORY: ${GITHUB_ERROR_REPORT_REPOSITORY:-}
    volumes:
      - config:/app/config
    networks:
      - default
      - scraper_net

volumes:
  uploads:
  outputs:
  config:

networks:
  default:
  scraper_net:
    external: true
    name: ${SCRAPER_NETWORK:-scraper_default}
